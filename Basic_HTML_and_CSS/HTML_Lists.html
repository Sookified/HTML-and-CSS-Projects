<!DOCTYPE html>

<html>
<head>
    <title>HTML Lists</title>

<link rel="stylesheet" type="text/css" href="CSS_Lists.css">
</head>


<body>


<h1>My Favorite Activities</h1>

<h2>Unordered List</h2>
<ul>
    <li>Going to the gym</li>
    <li>Walking</li>
    <li>Swimming</li>
    <li>Playing sports</li>
</ul>

<h2>Ordered List</h2>
<ol>
    <li>Wake up</li>
    <li>Have breakfast</li>
    <li>Go to the gym</li>
    <li>Complete my homework</li>
</ol>


</body>
</html>
