<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Over Image</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="image-container">
        <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1200&q=80" 
             alt="People working out in a gym">

        <div class="image-text">
            <h1>Body Temple</h1>
            <p>Build Strength. Build Confidence.</p>
        </div>
    </div>

</body>
</html>
