<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Change Password</title>
<link href="../Bootstrap/bootstrap-3.3.7-dist/bootstrap-3.3.7-dist/css/bootstrap.css" rel="stylesheet" type="text/css" />
</head>

<body>
<div class="container-fluid" style="padding-top:50px">


<div class="row" style="border:solid; height:100px; background-color:black">
<p> <h2 style="text-align:center; color:white; line-height:50px"><i><b> CHANGE PASSWORD</b> </i> </h2></p>
</div>

<div class="row" style="border:solid; height:500px; padding:20px; padding-top:50px">
<div class="col-lg-1" style="border:solid; height:320px"></div>
<div class="col-lg-10" style="border:solid; height:320px">
<div class="row" style="border:solid; height:80px">
<div class="col-lg-4" style="border:solid; height:80px">
<h3 style="text-align:center"><b> Old Password :</b> </h3>
</div>
<div class="col-lg-8" style="border:solid; height:80px">
<p style="padding:20px"><input type="text" placeholder="Enter Old Password" /></p>
</div>

</div>
<div class="row" style="border:solid; height:80px">
<div class="col-lg-4" style="border:solid; height:80px">
<h3 style="text-align:center"><b> New Password :</b> </h3>
</div>
<div class="col-lg-8" style="border:solid; height:80px">
<p style="padding:20px"><input type="text" placeholder="Enter New Password" /></p>
</div>
</div>
<div class="row" style="border:solid; height:80px">
<div class="col-lg-4" style="border:solid; height:80px">
<h3 style="text-align:center"><b> Confirm Password :</b> </h3>
</div>
<div class="col-lg-8" style="border:solid; height:80px">
<p style="padding:20px"><input type="text" placeholder="Confirm New Password" /></p>
</div>
</div>
<div class="row" style="border:solid; height:80px">
<p style="padding:20px; padding-left:350px"><input type="submit" value="submit" /></p>
</div>

</div>
<div class="col-lg-1" style="border:solid; height:320px"></div>

</div>



</div>
</body>
</html>
